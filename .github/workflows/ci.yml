name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      # One repository, three independent modules with their own go.mod: a matrix so a
      # failure names the module, and so one module's Go directive does not decide the
      # toolchain for the others.
      fail-fast: false
      matrix:
        module: [health, leader, metrics]
    name: ${{ matrix.module }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt: the following files are not formatted:"
            echo "$files"
            exit 1
          fi
          echo "gofmt: clean"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...
